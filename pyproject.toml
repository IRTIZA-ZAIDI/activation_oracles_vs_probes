[project]
name = "activation-oracles-vs-probes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.6",
    "numpy>=1.26,<2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
